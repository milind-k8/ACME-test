services:
  api:
    build: { context: ., dockerfile: packages/server/Dockerfile }
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/smt.db
      SEED_IF_EMPTY: "true" # demo only: seed 10,000 employees into a new, empty volume
    expose: ["3000"]
    volumes:
      - data:/app/data # SQLite file survives restarts
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  web:
    build: { context: ., dockerfile: packages/web/Dockerfile }
    ports: ["3000:80"]
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

volumes:
  data:
